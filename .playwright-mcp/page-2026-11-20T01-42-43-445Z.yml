    - generic [ref=f112e84]:
      - generic [ref=f112e86]:
        - heading "La prueba" [level=2] [ref=f112e87]
        - paragraph [ref=f112e88]: "Antes de contarte lo que podemos hacer, mira lo que ya hicimos. Dos operaciones reales corren con software que construimos: una importadora en Colombia y una empresa de monitoreo de seguridad que atiende propiedades en Estados Unidos. No son escenarios de portafolio ni maquetas; son negocios que abren todos los días."
      - generic [ref=f112e89]:
        - article [ref=f112e91]:
          - heading "Proactive Watch" [level=3] [ref=f112e92]
          - paragraph [ref=f112e93]: Monitoreo de seguridad remoto, Florida
          - paragraph [ref=f112e94]: "La plataforma que sostiene la operación: casos, historial de incidentes, usuarios y reportes."
          - paragraph [ref=f112e95]: Una operación que atiende propiedades en varios estados desde un solo panel.
        - article [ref=f112e97]:
          - heading "Importadora" [level=3] [ref=f112e98]
          - paragraph [ref=f112e99]: Comercio e importación, Colombia
          - paragraph [ref=f112e100]: "Una app para la gestión del negocio: inventario, ventas y lo que antes vivía en hojas sueltas."
          - paragraph [ref=f112e101]: El día de trabajo en un solo lugar, sin depender de una persona que se acuerde de todo.
    - generic [ref=f112e103]:
      - generic [ref=f112e105]:
        - heading "Cómo trabajamos" [level=2] [ref=f112e106]
        - paragraph [ref=f112e107]: "Casi ningún proyecto se cae por la tecnología: se cae porque nadie entendió cómo trabaja el negocio. Por eso empezamos mirando tu operación, no escribiendo código. Construimos lo más pequeño que resuelve el problema, lo ponemos a funcionar, y te entregamos el código y la documentación para que no dependas de nosotros."
