      - generic [ref=f112e39]:
        - paragraph [ref=f112e40]: Qué hacemos
        - heading "Lo que construimos" [level=2] [ref=f112e41]
        - paragraph [ref=f112e42]: "Una empresa chica no necesita otro sistema: necesita que lo que ya tiene deje de estorbar. Casi siempre son tres cosas —las ventas en un Excel, los pagos en una cuenta, las decisiones en la cabeza del dueño— y ninguna habla con las otras. Eso es lo que construimos: la parte que falta para que el día cierre solo."
      - generic [ref=f112e43]:
        - article [ref=f112e45]:
          - heading "La operación que vive en tres Excels" [level=3] [ref=f112e46]
          - paragraph [ref=f112e47]: Construimos el sistema que la reemplaza
          - paragraph [ref=f112e48]: Inventario, ventas y cartera en un solo lugar, con los datos que ya tienes.
        - article [ref=f112e50]:
          - heading "Los sistemas que no se hablan" [level=3] [ref=f112e51]
          - paragraph [ref=f112e52]: Conectamos lo que ya usas
          - paragraph [ref=f112e53]: Pagos, WhatsApp, planillas y el software viejo, sin cambiar de herramienta.
        - article [ref=f112e55]:
          - heading "Las decisiones que se toman a ciegas" [level=3] [ref=f112e56]
          - paragraph [ref=f112e57]: Analítica y contenido con IA
          - paragraph [ref=f112e58]: Qué te deja plata, qué no, y qué publicar sin adivinar.
    - generic [ref=f112e60]:
      - generic [ref=f112e61]:
        - generic [ref=f112e62]:
          - paragraph [ref=f112e63]: Hacia dónde vamos
          - heading "Las herramientas" [level=2] [ref=f112e64]
        - paragraph [ref=f112e65]: "Un comerciante en Colombia hace tres cosas todos los días: cobra, cuenta y cierra. Cada una vive en un lugar distinto —el QR del banco, el cuaderno, el WhatsApp— y ninguna le habla a la otra."
      - list [ref=f112e66]:
        - listitem [ref=f112e67]:
          - heading "QR Libre" [level=3] [ref=f112e69]
          - paragraph [ref=f112e70]: "Empezamos por lo primero: QR Libre avisa en voz alta cuando entra un pago, sin comprar equipos y sin mensualidad."
        - listitem [ref=f112e71]:
          - heading "Conciliación" [level=3] [ref=f112e73]
          - paragraph [ref=f112e74]: "Sigue la conciliación: que la plata que entró coincida con lo que se vendió, sin abrir tres aplicaciones."
        - listitem [ref=f112e75]:
          - heading "Cierre" [level=3] [ref=f112e77]
          - paragraph [ref=f112e78]: "Y el cierre: cuánto entró, cuánto salió, cuánto quedó, en una pantalla que se entiende sin ser contador."
      - generic [ref=f112e79]:
        - paragraph [ref=f112e81]: Nada de esto pide cuenta, anuncios ni depender de nosotros. El código es abierto; si un día no estamos, sigue funcionando.
        - link "Conocer QR Libre" [ref=f112e82] [cursor=pointer]:
